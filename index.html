<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saeb Tudo</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/index.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container screen-auth">

        <!-- BLURS -->
        <div class="blur blur-1"></div>
        <div class="blur blur-2"></div>
        <div class="blur blur-3"></div>
        <div class="blur blur-4"></div>

        <!-- LOGO -->
        <div class="logo-container">
            <img src="imagens/logo saeb tudo.svg" alt="Saeb Tudo" class="logo">
        </div>

        <!-- CONTEÚDO -->
        <div class="content">

            <h1 class="titulo">
                Seu futuro começa<br>
                com o que você aprende hoje.
            </h1>

            <p class="subtitulo">
                Simulados, exercícios e desafios<br>
                para você ir mais longe.
            </p>

            <img src="imagens/livro inicio.png" alt="Livro" class="livro">

            <div class="botoes">

                <button
                    class="btn-primary"
                    onclick="window.location.href='login.html'">
                    Entrar
                </button>

                <button
                    class="btn-outline"
                    onclick="window.location.href='cadastro.html'">
                    Criar conta
                </button>

            </div>

        </div>

    </div>

    <script src="js/index.js"></script>

</body>
</html>
