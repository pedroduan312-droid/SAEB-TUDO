<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Saeb Tudo</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/cadastro.css">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

    <div class="container auth-container">

        <div class="blur blur-1"></div>
        <div class="blur blur-2"></div>
        <div class="blur blur-3"></div>
        <div class="blur blur-4"></div>
        <div class="blur blur-5"></div>

        <button class="btn-voltar" onclick="window.location.href='login.html'">

            <img src="imagens/seta.svg" alt="Voltar">

        </button>

        <img
            src="imagens/logo saeb tudo.svg"
            alt="Saeb Tudo"
            class="logo-auth">

        <div class="textos">

            <h1>Crie sua conta</h1>

            <p>Preencha os dados abaixo</p>

        </div>

        <form id="cadastroForm" class="form-auth">

            <div class="input-group">

                <img src="imagens/usuario.svg" alt="Usuário">

                <input
                    type="text"
                    id="usuario"
                    placeholder="Usuário">

            </div>

            <div class="input-group">

                <img src="imagens/email.svg" alt="Email">

                <input
                    type="email"
                    id="email"
                    placeholder="E-mail">

            </div>

            <div class="input-group">

                <img src="imagens/cadeado.svg" alt="Senha">

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha">

                <img
                    src="imagens/olho-fechado.svg"
                    alt="Mostrar senha"
                    class="toggle-senha"
                    id="toggleSenha">

            </div>

            <div class="input-group">

                <img src="imagens/cadeado.svg" alt="Confirmar senha">

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Confirmar senha">

                <img
                    src="imagens/olho-fechado.svg"
                    alt="Mostrar senha"
                    class="toggle-senha"
                    id="toggleConfirmar">

            </div>

            <label class="checkbox">

                <input type="checkbox" id="termos">

                <span>
                    Eu aceito os Termos de Uso e a Política de Privacidade
                </span>

            </label>

            <button
                type="submit"
                class="btn-primary">

                Criar conta

            </button>

        </form>

        <p class="troca-tela">

            Já possui uma conta?

            <a href="login.html">

                Entrar

            </a>

        </p>

    </div>

    <script src="js/cadastro.js"></script>

</body>

</html>
