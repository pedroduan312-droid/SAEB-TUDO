<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saeb Tudo - Home</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/home.css">
</head>

<body>

    <div class="app-container">

        <!-- BACKGROUND DECORATIVO -->
        <div class="bg-blur blur-1"></div>
        <div class="bg-blur blur-2"></div>

        <!-- HEADER -->
        <header class="home-header">

            <div class="user-area">

                <div class="user-avatar">
                    <img src="../imagens/user.png" alt="Foto do usuário" id="userPhoto">
                </div>

                <div class="user-info">
                    <h1 id="greeting">
                        Bom dia, Duan!
                    </h1>

                    <p id="motivationText">
                        Continue sua jornada e conquiste grandes resultados.
                    </p>
                </div>

            </div>

            <img
                src="../imagens/logo saeb tudo.svg"
                alt="Saeb Tudo"
                class="home-logo"
            >

        </header>

        <!-- CONTEÚDO -->
        <main class="home-content">

            <!-- CARROSSEL -->
            <section class="hero-carousel">

                <div class="carousel-container">

                    <div class="carousel-slide active">
                        <img src="../imagens/banner1.png" alt="">
                    </div>

                    <div class="carousel-slide">
                        <img src="../imagens/banner2.png" alt="">
                    </div>

                    <div class="carousel-slide">
                        <img src="../imagens/banner3.png" alt="">
                    </div>

                </div>

                <div class="carousel-indicators">
                    <span class="indicator active"></span>
                    <span class="indicator"></span>
                    <span class="indicator"></span>
                </div>

            </section>

            <!-- ESTUDAR -->
            <section class="study-section">

                <h2 class="section-title">
                    Escolha o que estudar
                </h2>

                <div class="study-grid">

                    <button class="study-item portugues">

                        <div class="study-icon">
                            <img src="../imagens/icon-portugues.svg">
                        </div>

                        <span>Português</span>

                    </button>

                    <button class="study-item matematica">

                        <div class="study-icon">
                            <img src="../imagens/icon-matematica.svg">
                        </div>

                        <span>Matemática</span>

                    </button>

                    <button class="study-item simulados">

                        <div class="study-icon">
                            <img src="../imagens/icon-simulados.svg">
                        </div>

                        <span>Simulados</span>

                    </button>

                    <button class="study-item desafios">

                        <div class="study-icon">
                            <img src="../imagens/icon-desafios.svg">
                        </div>

                        <span>Desafios</span>

                    </button>

                </div>

            </section>

            <!-- TREINOS RÁPIDOS -->
            <section class="quick-section">

                <h2 class="section-title">
                    Seus Treinos Rápidos
                </h2>

                <div class="quick-grid">

                    <article class="quick-card quick-questions">

                        <div class="quick-icon">
                            <img src="../imagens/icon-flash.svg">
                        </div>

                        <div class="quick-info">
                            <h3>Questões rápidas</h3>
                            <p>responda em até 10 min</p>
                        </div>

                    </article>

                    <article class="quick-card quick-challenge">

                        <div class="quick-icon">
                            <img src="../imagens/icon-fire.svg">
                        </div>

                        <div class="quick-info">
                            <h3>Desafio do dia</h3>
                            <p>responda 5 questões</p>
                        </div>

                    </article>

                </div>

            </section>

            <!-- STREAK -->
            <section class="streak-section">

                <h2 class="section-title">
                    Sua sequência
                </h2>

                <div class="streak-card">

                    <div class="streak-left">

                        <div class="streak-fire">
                            🔥
                        </div>

                        <div class="streak-info">

                            <span class="streak-label">
                                Sequência Atual
                            </span>

                            <h2 id="streakDays">
                                13 Dias
                            </h2>

                            <p>
                                Continue assim!
                            </p>

                        </div>

                    </div>

                    <div class="streak-right">

                        <div class="calendar-grid">

                            <div class="day completed"></div>
                            <div class="day completed"></div>
                            <div class="day completed"></div>
                            <div class="day"></div>
                            <div class="day"></div>

                            <div class="day completed"></div>
                            <div class="day completed"></div>
                            <div class="day completed"></div>
                            <div class="day completed"></div>
                            <div class="day"></div>

                            <div class="day completed"></div>
                            <div class="day completed"></div>
                            <div class="day completed"></div>
                            <div class="day completed"></div>
                            <div class="day completed"></div>

                        </div>

                    </div>

                </div>

            </section>

        </main>

        <!-- NAVBAR -->
        <nav class="bottom-navbar">

            <button class="nav-item active">

                <img src="../imagens/home.svg" alt="">
                <span>Home</span>

            </button>

            <button class="nav-item">

                <img src="../imagens/simulados.svg" alt="">
                <span>Simulados</span>

            </button>

            <button class="nav-item">

                <img src="../imagens/desempenho.svg" alt="">
                <span>Desempenho</span>

            </button>

            <button class="nav-item">

                <img src="../imagens/perfil.svg" alt="">
                <span>Perfil</span>

            </button>

        </nav>

    </div>

    <script src="../js/home.js"></script>

</body>

</html>
