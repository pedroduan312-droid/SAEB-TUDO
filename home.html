<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saeb Tudo</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/home.css">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="container home-container">

    <!-- HEADER -->

    <header class="header">

        <div class="usuario">

            <img
                src="imagens/perfil-padrao.png"
                class="foto-perfil"
                id="fotoPerfil">

            <div class="saudacao">

                <h2 id="tituloSaudacao">
                    Bom dia, Aluno!
                </h2>

                <p>
                    Continue sua jornada e
                    conquiste grandes resultados
                </p>

            </div>

        </div>

        <img
            src="imagens/logo saeb tudo.svg"
            class="logo-home">

    </header>

    <!-- CONTEÚDO -->

    <main class="conteudo">

        <!-- =========================
             CARROSSEL
        ========================== -->

        <section class="banner-section">

            <div class="carousel">

                <div class="carousel-track">

                    <div class="banner">
                        <img src="imagens/banner1.png">
                    </div>

                    <div class="banner">
                        <img src="imagens/banner2.png">
                    </div>

                    <div class="banner">
                        <img src="imagens/banner3.png">
                    </div>

                </div>

            </div>

            <div class="indicadores">

                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </section>

        <!-- =========================
             MATÉRIAS
        ========================== -->

        <section class="materias">

            <h3>Escolha o que estudar</h3>

            <div class="materias-grid">

                <a href="desafios-portugues.html" class="materia">

                    <div class="icone portugues">
                        <img src="imagens/portugues.svg">
                    </div>

                    <span>Português</span>

                </a>

                <a href="desafios-matematica.html" class="materia">

                    <div class="icone matematica">
                        <img src="imagens/matematica.svg">
                    </div>

                    <span>Matemática</span>

                </a>

                <a href="simulados.html" class="materia">

                    <div class="icone simulados">
                        <img src="imagens/simulados.svg">
                    </div>

                    <span>Simulados</span>

                </a>

                <a href="desafios.html" class="materia">

                    <div class="icone desafios">
                        <img src="imagens/desafios.svg">
                    </div>

                    <span>Desafios</span>

                </a>

            </div>

        </section>

        <!-- =========================
             TREINOS RÁPIDOS
        ========================== -->

        <section class="treinos">

            <h3>Seus Treinos Rápidos</h3>

            <div class="treinos-grid">

                <a href="quiz.html" class="treino-card rapido">

                    <img src="imagens/raio.svg">

                    <div>

                        <h4>Questões rápidas</h4>

                        <p>Responda em até 10 minutos</p>

                    </div>

                </a>

                <a href="quiz.html" class="treino-card desafio-dia">

                    <img src="imagens/fogo.svg">

                    <div>

                        <h4>Desafio do dia</h4>

                        <p>Responda 5 questões</p>

                    </div>

                </a>

            </div>

        </section>

        <!-- =========================
             SEQUÊNCIA
        ========================== -->

        <section class="sequencia-card">

            <div class="sequencia-info">

                <img src="imagens/fogo.svg">

                <div>

                    <span>Sequência Atual</span>

                    <h2 id="diasSequencia">
                        13 Dias
                    </h2>

                    <p>Continue assim!</p>

                </div>

            </div>

            <div class="calendario" id="calendarioSequencia">

            </div>

        </section>

    </main>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a class="nav-item active" href="home.html">
            <img src="imagens/home-ativo.svg">
        </a>

        <a class="nav-item" href="simulados.html">
            <img src="imagens/materias.svg">
        </a>

        <a class="nav-item" href="desempenho.html">
            <img src="imagens/desempenho.svg">
        </a>

        <a class="nav-item" href="perfil.html">
            <img src="imagens/perfil.svg">
        </a>

    </nav>

</div>

<script src="js/home.js"></script>

</body>
</html>
