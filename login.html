<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Saeb Tudo</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container auth-container">

        <!-- BLURS -->

        <div class="blur blur-1"></div>
        <div class="blur blur-2"></div>
        <div class="blur blur-3"></div>
        <div class="blur blur-4"></div>

        <!-- VOLTAR -->

        <button class="btn-voltar" onclick="window.location.href='index.html'">

            <img src="imagens/seta.svg" alt="Voltar">

        </button>

        <!-- LOGO -->

        <img
            src="imagens/logo saeb tudo.svg"
            alt="Saeb Tudo"
            class="logo-auth">

        <!-- TEXTO -->

        <div class="textos">

            <h1>Que bom te ver denovo!</h1>

            <p>Faça login para continuar</p>

        </div>

        <!-- FORM -->

        <form id="loginForm" class="form-auth">

            <div class="input-group">

                <img src="imagens/email.svg" alt="Email">

                <input
                    type="text"
                    id="usuario"
                    placeholder="E-mail ou usuário">

            </div>

            <div class="input-group">

                <img src="imagens/cadeado.svg" alt="Senha">

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha">

                <img
                    src="imagens/olho-fechado.svg"
                    alt="Mostrar senha"
                    class="toggle-senha"
                    id="toggleSenha">

            </div>

            <a href="#" class="esqueci">

                Esqueceu sua senha?

            </a>

            <button
                type="submit"
                class="btn-primary">

                Entrar

            </button>

        </form>

        <!-- RODAPÉ -->

        <p class="troca-tela">

            Não tem uma conta?

            <a href="cadastro.html">

                Criar conta

            </a>

        </p>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
