<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Desempenho</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/desempenho.css">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="container desempenho-container">

    <!-- HEADER -->

    <header class="header">

        <div>

            <h1>Desempenho</h1>

            <p>
                Acompanhe sua evolução
                e continue crescendo.
            </p>

        </div>

        <img src="imagens/logo saeb tudo.svg"
             class="logo-header">

    </header>

    <!-- CONTEÚDO -->

    <main class="conteudo">

        <!-- ==========================
             DESEMPENHO GERAL
        =========================== -->

        <section class="card desempenho-geral">

            <h3>Desempenho geral</h3>

            <div class="desempenho-content">

                <div class="progress-circle">

                    <div class="circle">

                        <span id="percentualGeral">
                            75%
                        </span>

                    </div>

                </div>

                <div class="desempenho-info">

                    <h2 id="tituloDesempenho">
                        Muito Bom!
                    </h2>

                    <p id="mensagemDesempenho">
                        Você está acima da média,
                        continue assim!
                    </p>

                    <div class="variacao"
                         id="variacao">

                        +12%

                    </div>

                    <span class="texto-variacao">
                        em relação a ontem
                    </span>

                </div>

            </div>

        </section>

        <!-- ==========================
             MATÉRIAS
        =========================== -->

        <section class="card">

            <h3>Acertos por matéria</h3>

            <div class="materia-item">

                <div class="linha-info">

                    <span>Língua Portuguesa</span>
                    <strong id="portuguesValor">65%</strong>

                </div>

                <div class="barra">

                    <div class="barra-fill portugues"
                         id="barraPortugues">

                    </div>

                </div>

            </div>

            <div class="materia-item">

                <div class="linha-info">

                    <span>Matemática</span>
                    <strong id="matematicaValor">70%</strong>

                </div>

                <div class="barra">

                    <div class="barra-fill matematica"
                         id="barraMatematica">

                    </div>

                </div>

            </div>

        </section>

        <!-- ==========================
             EVOLUÇÃO
        =========================== -->

        <section class="card">

            <h3>Evolução</h3>

            <canvas id="graficoEvolucao"
                    width="500"
                    height="220">

            </canvas>

        </section>

        <!-- ==========================
             SEQUÊNCIA
        =========================== -->

        <section class="sequencia-card">

            <div class="sequencia-info">

                <img src="imagens/fogo.svg">

                <div>

                    <span>
                        Sequência Atual
                    </span>

                    <h2 id="diasSequencia">
                        13 Dias
                    </h2>

                    <p id="mensagemSequencia">
                        Continue assim!
                    </p>

                </div>

            </div>

            <div class="calendario"
                 id="calendarioSequencia">

            </div>

        </section>

    </main>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a class="nav-item"
           href="home.html">

            <img src="imagens/home.svg">

        </a>

        <a class="nav-item"
           href="simulados.html">

            <img src="imagens/materias.svg">

        </a>

        <a class="nav-item active"
           href="desempenho.html">

            <img src="imagens/desempenho-ativo.svg">

        </a>

        <a class="nav-item"
           href="perfil.html">

            <img src="imagens/perfil.svg">

        </a>

    </nav>

</div>

<script src="js/desempenho.js"></script>

</body>
</html>
