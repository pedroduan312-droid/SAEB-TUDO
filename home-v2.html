<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAEB Tudo</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/home-v2.css">

</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="perfil">
            <img src="imagens/user.png" alt="Foto do usuário">
        </div>

        <div class="saudacao">
            <h2 id="saudacao">Bom dia! Aluno</h2>
            <p>Pronto pra praticar?</p>
        </div>

        <img src="imagens/logo saeb tudo.svg" class="logo-app" alt="Logo do aplicativo">

    <!-- CONTEÚDO -->

    <main class="conteudo">

        <!-- META -->

        <section class="meta-card">

    <img
        src="imagens/decoracao-meta.png"
        class="meta-bg"
        alt="">

    <img
        src="imagens/alvo-meta.png"
        class="meta-alvo"
        alt="">

    <div class="meta-topo">

        <span class="meta-tag">
            🎯 META DA SEMANA
        </span>

    </div>

    <div class="meta-corpo">

        <div class="meta-numeros">

            <span>
                16 de 20 questões
            </span>

            <strong>
                80%
            </strong>

        </div>

        <div class="barra-progresso">

            <div class="barra-preenchida"></div>

        </div>

        <button class="btn-meta">

            Continuar estudando →

        </button>

    </div>

</section>

        <!-- MATÉRIAS -->

        <section class="materias">

            <div class="cards-materias">

                <div
class="materia-card portugues"
data-materia="portugues">

    <img
        src="imagens/portugues-ilustracao.png"
        class="materia-ilustracao"
        alt="">

    <div class="materia-conteudo">

        <h3>
            Língua Portuguesa
        </h3>

        <button class="btn-materia">

            Estudar Agora →

        </button>

    </div>

</div>

                <div
class="materia-card matematica"
data-materia="matematica">

    <img
        src="imagens/matematica-ilustracao.png"
        class="materia-ilustracao"
        alt="">

    <div class="materia-conteudo">

        <h3>
            Matemática
        </h3>

        <button class="btn-materia">

            Estudar Agora →

        </button>

    </div>

</div>
        </section>

        <!-- DESAFIO -->

        <section class="desafio">

            <h2 class="section-title">
                Desafio Do Dia
            </h2>

            <div class="desafio-card">

    <img
        src="imagens/fogo-desafio.png"
        class="icone-fogo"
        alt="">

    <div class="desafio-info">

        <span class="desafio-tag">
            DESAFIO DO DIA ⚡
        </span>

        <h3>
            Responda 5 questões
        </h3>

    </div>

    <button id="btnDesafio">

        Começar →

    </button>

</div>

        </section>

        <!-- CONQUISTAS -->

        <section class="conquistas">

            <div class="section-header">

                <h2>
                    Conquistas
                </h2>

                <button class="ver-mais">
                    Ver Mais →
                </button>

            </div>

<div class="conquistas-scroll">

    <div class="conquista-card"></div>

    <div class="conquista-card"></div>

    <div class="conquista-card"></div>

    <div class="conquista-card"></div>

    <div class="conquista-card"></div>

    <div class="conquista-card"></div>

</div>

        </section>

        <div class="espaco-final"></div>

    </main>

    <!-- NAVBAR -->

    <nav class="navbar">

        <button
            class="nav-item ativo"
            data-page="home">

            <img src="imagens/home.svg">

        </button>

        <button
            class="nav-item"
            data-page="simulados">

            <img src="imagens/simulados.svg">

        </button>

        <button
            class="nav-item"
            data-page="desempenho">

            <img src="imagens/desempenho.svg">

        </button>

        <button
            class="nav-item"
            data-page="perfil">

            <img src="imagens/perfil.svg">

        </button>

    </nav>

</div>

<script src="js/home-v2.js"></script>

</body>

</html>
