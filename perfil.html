<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil - SAEB Tudo</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/perfil.css">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="perfil-container">

    <!-- HEADER -->

    <header class="header">

        <h1>Perfil</h1>

        <img
            src="imagens/logo saeb tudo.svg"
            class="logo-header">

    </header>

    <!-- CONTEÚDO -->

    <main class="conteudo">

        <!-- CARD USUÁRIO -->

        <section class="usuario-card aparecer">

            <div class="foto-wrapper">

                <img
                    src="imagens/perfil-padrao.png"
                    id="fotoPerfil"
                    class="foto-perfil">

                <div class="camera-icon">
                    <img src="imagens/camera.svg">
                </div>

            </div>

            <div class="usuario-info">

                <h2 id="nomePerfil">
                    Olá, Aluno!
                </h2>

                <p>
                    Continue evoluindo todos os dias
                </p>

            </div>

        </section>

        <!-- ESTATÍSTICAS -->

        <section class="stats-card aparecer">

            <div class="stat-item">

                <span class="stat-label">
                    quizzes
                </span>

                <span
                    class="stat-num azul"
                    id="statQuizzes">
                    0
                </span>

            </div>

            <div class="divider"></div>

            <div class="stat-item">

                <span class="stat-label">
                    questões
                </span>

                <span
                    class="stat-num amarelo"
                    id="statQuestoes">
                    0
                </span>

            </div>

            <div class="divider"></div>

            <div class="stat-item">

                <span class="stat-label">
                    acertos
                </span>

                <span
                    class="stat-num rosa"
                    id="statAcertos">
                    0
                </span>

            </div>

        </section>

        <!-- MENU -->

        <section class="menu-card aparecer" id="btnEditarPerfil">

            <div class="menu-esquerda">

                <img
                    src="imagens/editar.svg"
                    class="menu-icon">

                <span>
                    Editar perfil
                </span>

            </div>

            <img
                src="imagens/seta-direita.svg"
                class="seta-menu">

        </section>

        <section class="menu-card aparecer" id="btnAjuda">

            <div class="menu-esquerda">

                <img
                    src="imagens/ajuda.svg"
                    class="menu-icon">

                <span>
                    Ajuda e suporte
                </span>

            </div>

            <img
                src="imagens/seta-direita.svg"
                class="seta-menu">

        </section>

        <section class="menu-card aparecer" id="btnSairConta">

            <div class="menu-esquerda">

                <img
                    src="imagens/sair.svg"
                    class="menu-icon">

                <span>
                    Sair
                </span>

            </div>

            <img
                src="imagens/seta-direita.svg"
                class="seta-menu">

        </section>

    </main>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a class="nav-item" href="home.html">
            <img src="imagens/home.svg">
        </a>

        <a class="nav-item" href="simulados.html">
            <img src="imagens/materias.svg">
        </a>

        <a class="nav-item" href="desempenho.html">
            <img src="imagens/desempenho.svg">
        </a>

        <a class="nav-item active" href="perfil.html">
            <img src="imagens/perfil-ativo.svg">
        </a>

    </nav>

</div>

<!-- MODAL EDITAR -->

<div class="modal" id="modalEditar">

    <div class="modal-content">

        <button class="fechar-modal" id="fecharModal">
            <img src="imagens/fechar.svg">
        </button>

        <div class="foto-editar-wrapper">

            <img
                src="imagens/perfil-padrao.png"
                id="fotoEditar"
                class="foto-editar">

            <input
                type="file"
                id="inputFoto"
                accept="image/*"
                hidden>

            <button id="btnTrocarFoto">
                Alterar foto
            </button>

            <button id="btnRemoverFoto">
                Remover foto
            </button>

        </div>

        <input
            type="text"
            id="inputNome"
            placeholder="Nome">

        <input
            type="email"
            id="inputEmail"
            placeholder="E-mail">

        <div class="senha-container">

            <input
                type="password"
                id="inputSenha"
                placeholder="Senha">

            <img
                src="imagens/olho.svg"
                id="btnMostrarSenha">

        </div>

        <button id="btnSalvarAlteracoes">
            Salvar alterações
        </button>

    </div>

</div>

<!-- MODAL SAIR -->

<div class="modal" id="modalSair">

    <div class="modal-confirmacao">

        <h3>
            Deseja realmente sair?
        </h3>

        <p>
            Você precisará entrar novamente para acessar sua conta.
        </p>

        <div class="botoes-sair">

            <button id="cancelarSair">
                Cancelar
            </button>

            <button id="confirmarSair">
                Sair
            </button>

        </div>

    </div>

</div>

<script src="js/perfil.js"></script>

</body>
</html>
